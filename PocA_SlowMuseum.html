<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Slow Museum — Gallery</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}
body {
  background: #e9ded0;
  display: flex; flex-direction: column;
  min-height: 100vh;
  padding: 24px 32px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  line-height: 1.3;
}
main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  transform: translateY(-20px);
}
#phone-title {
  position: absolute;
  top: 25px;
  left: 33px;
  font-size: 28px;
  font-weight: 700;
  color: #7d7169;
  letter-spacing: -0.01em;
  z-index: 3;
  pointer-events: none;
}
#canvas-wrap {
  width: 384px; height: 768px;
  background: #ffffff;
  border-radius: 40px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  touch-action: none;
  flex-shrink: 0;
  position: relative;
  z-index: 2;
}
canvas { display:block; cursor:grab; touch-action: none; }
canvas:active { cursor:grabbing; }

#cards {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 268px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 12px;
  padding: 16px 24px 28px;
  background: transparent;
  z-index: 2;
  pointer-events: none;
}
.card {
  background: #f5efe8;
  border-radius: 16px;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.card .name { font-size: 13px; color: #666; font-weight: 600; }
.card .score { font-size: 26px; color: #7d7169; font-weight: 700; line-height: 1.1; }

#sliders {
  width: 384px;
  height: 768px;
  background: #ffffff;
  border-radius: 0 40px 40px 0;
  padding: 90px 28px 28px 56px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.08);
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  gap: 24px;
  margin-left: -32px;
  position: relative;
  z-index: 1;
  flex-shrink: 0;
}
#sliders h2 {
  font-size: 16px;
  color: #888;
  font-weight: 500;
  margin-top: 5px;
  margin-bottom: 4px;
  letter-spacing: 0.02em;
}
.slider-row { display: flex; flex-direction: column; gap: 9px; }
.slider-row .label-row {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 15px; color: #7d7169;
}
.slider-row .label { font-weight: 600; color: #7d7169; }
.slider-row .value { font-variant-numeric: tabular-nums; color: #7d7169; font-size: 14px; font-weight: 600; }
.slider-row input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 8px; border-radius: 4px;
  background: #e0e0e0; outline: none;
}
.slider-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 20px; height: 20px; border-radius: 50%;
  background: #7d7169; cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
.slider-row input[type="range"]::-moz-range-thumb {
  width: 20px; height: 20px; border-radius: 50%;
  background: #7d7169; cursor: pointer; border: none;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

#submit-btn {
  margin-top: 2px;
  padding: 10px 32px;
  border-radius: 999px;
  background: #7d7169;
  color: #ffffff;
  font-size: 16px;
  font-weight: 700;
  line-height: 1.2;
  border: none;
  cursor: pointer;
  align-self: center;
  box-shadow: 0 4px 12px rgba(125, 113, 105, 0.4);
  transition: transform 0.1s ease, box-shadow 0.1s ease;
  letter-spacing: 0.02em;
  font-family: inherit;
}
#submit-btn:hover { box-shadow: 0 6px 16px rgba(125, 113, 105, 0.5); }
#submit-btn:active { transform: scale(0.97); }

#triggers {
  margin-top: -2px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
#triggers h3 {
  font-size: 16px;
  color: #888;
  font-weight: 500;
  letter-spacing: 0.02em;
}
#trigger-buttons {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 14px;
}
.trigger-btn {
  padding: 5px 14px;
  border-radius: 999px;
  background: transparent;
  color: #7d7169;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.2;
  border: 1px solid #7d7169;
  cursor: pointer;
  transition: background 0.1s ease;
  white-space: nowrap;
  font-family: inherit;
}
.trigger-btn:hover { background: rgba(125, 113, 105, 0.12); }
.trigger-btn:active { transform: scale(0.97); }
</style>
</head>
<body>
<main>
<div id="canvas-wrap">
  <div id="phone-title">Slow Museum</div>
  <canvas id="gallery" width="384" height="768"></canvas>
  <div id="cards">
    <div class="card"><div class="name">잘 움직이기</div><div class="score" id="card-move">72</div></div>
    <div class="card"><div class="name">잘 쉬기</div><div class="score" id="card-rest">60</div></div>
    <div class="card"><div class="name">잘 가꾸기</div><div class="score" id="card-groom">48</div></div>
    <div class="card"><div class="name">잘 다스리기</div><div class="score" id="card-manage">80</div></div>
  </div>
</div>

<div id="sliders">
  <h2>점수 컨트롤</h2>
  <div class="slider-row">
    <div class="label-row"><span class="label">잘 움직이기</span><span class="value" id="val-move">72</span></div>
    <input type="range" min="0" max="100" value="72" id="slider-move">
  </div>
  <div class="slider-row">
    <div class="label-row"><span class="label">잘 쉬기</span><span class="value" id="val-rest">60</span></div>
    <input type="range" min="0" max="100" value="60" id="slider-rest">
  </div>
  <div class="slider-row">
    <div class="label-row"><span class="label">잘 가꾸기</span><span class="value" id="val-groom">48</span></div>
    <input type="range" min="0" max="100" value="48" id="slider-groom">
  </div>
  <div class="slider-row">
    <div class="label-row"><span class="label">잘 다스리기</span><span class="value" id="val-manage">80</span></div>
    <input type="range" min="0" max="100" value="80" id="slider-manage">
  </div>
  <button id="submit-btn">입력</button>
  <div id="triggers">
    <h3>트리거</h3>
    <div id="trigger-buttons">
      <button class="trigger-btn">100번째 방문</button>
      <button class="trigger-btn">지난 한 달 간 미접속</button>
      <button class="trigger-btn">할로윈 이벤트</button>
      <button class="trigger-btn">동일연령 총점 평균보다 낮음</button>
      <button class="trigger-btn">잘 다스리기 20점 하락</button>
    </div>
  </div>
</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const W = 384, H = 768;
const canvas = document.getElementById('gallery');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbcb6a9);

// ─── 갤러리 실내 치수 ───
const ROOM_W = 8;          // x: -4 .. 4
const ROOM_H = 4.6;        // y: 0 .. 4.6
const BACK_Z  = -10;       // 안쪽 벽 (중앙 벽체)
const FRONT_Z = 6;         // 입구 쪽
const ROOM_D  = FRONT_Z - BACK_Z;
const HALF_W  = ROOM_W / 2;
const MID_Z   = (BACK_Z + FRONT_Z) / 2;

// ─── 표면 재질 ───
// 정면벽(feature)은 따뜻하고 밝게, 양옆 벽은 한 단계 어둡고 차갑게 →
// 동일 재질일 때 안 보이던 오목 코너가 값(value) 경계로 항상 읽힘.
const backWallMat = new THREE.MeshStandardMaterial({ color: 0xf9f5ef, roughness: 0.96, metalness: 0 }); // 가운데 벽: 가장 밝게
const sideWallMat = new THREE.MeshStandardMaterial({ color: 0xdbd5c6, roughness: 0.96, metalness: 0 });
const leftWallMat = new THREE.MeshStandardMaterial({ color: 0xf0ebdf, roughness: 0.96, metalness: 0 }); // 왼쪽 벽: 중간 톤(아주 살짝 밝게)
const floorMat = new THREE.MeshStandardMaterial({ color: 0xc9bca2, roughness: 0.65, metalness: 0.05 });
const ceilMat  = new THREE.MeshStandardMaterial({ color: 0xfbf9f3, roughness: 1.0,  metalness: 0 });

// ─── 바닥 / 천장 ───
const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_D), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.set(0, 0, MID_Z);
floor.receiveShadow = true;
scene.add(floor);

const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_D), ceilMat);
ceiling.rotation.x = Math.PI / 2;
ceiling.position.set(0, ROOM_H, MID_Z);
scene.add(ceiling);

// ─── 벽체 (존 매핑) ───
// 중앙 벽체(안쪽) — 잘 가꾸기 / 초상화
const backWall = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W, ROOM_H), backWallMat);
backWall.position.set(0, ROOM_H / 2, BACK_Z);
backWall.receiveShadow = true;
scene.add(backWall);

// 왼쪽 벽체 — 잘 쉬기 / 풍경화
const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_D, ROOM_H), leftWallMat);
leftWall.rotation.y = Math.PI / 2;
leftWall.position.set(-HALF_W, ROOM_H / 2, MID_Z);
leftWall.receiveShadow = true;
scene.add(leftWall);

// 오른쪽 벽체 — 잘 다스리기 / 추상화
const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_D, ROOM_H), sideWallMat);
rightWall.rotation.y = -Math.PI / 2;
rightWall.position.set(HALF_W, ROOM_H / 2, MID_Z);
rightWall.receiveShadow = true;
scene.add(rightWall);


// ─── 플레이스홀더: 액자 (다음 단계에서 실제 작품 텍스처로 교체) ───
function makeFrame(w, h) {
  const g = new THREE.Group();
  const frame = new THREE.Mesh(
    new THREE.BoxGeometry(w + 0.16, h + 0.16, 0.07),
    new THREE.MeshStandardMaterial({ color: 0x262420, roughness: 0.55 })
  );
  const art = new THREE.Mesh(
    new THREE.PlaneGeometry(w, h),
    new THREE.MeshStandardMaterial({ color: 0xe5dfd1, roughness: 1.0 })
  );
  art.position.z = 0.045;
  // 벽 부착 액자는 그림자 끔: 태양광이 벽을 스칠 때 생기는 딱딱한 사각 그림자 방지.
  frame.castShadow = false;
  g.add(frame); g.add(art);
  g.userData.art = art;
  return g;
}

// ─── 플레이스홀더: 조각 전시대 (다음 단계에서 실제 조각 모델로 교체) ───
// PED_H = 기준 전시대 높이. 향후 불러올 조각 모델에 따라 전시대 높이를
// 4종류로 매핑 예정: 얕은/중간/높은 + 전시대 없이 바닥에 놓는 타입(h=0).
const PED_H = 0.6;
function makePedestal(h) {
  const g = new THREE.Group();
  let topY = 0;
  if (h > 0) {
    const base = new THREE.Mesh(
      new THREE.BoxGeometry(0.8, h, 0.8),
      new THREE.MeshStandardMaterial({ color: 0xeee9dd, roughness: 0.9 })
    );
    base.position.y = h / 2;
    base.castShadow = true; base.receiveShadow = true;
    g.add(base);
    topY = h;
  }
  const marker = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.3, 0),
    new THREE.MeshStandardMaterial({ color: 0xb6ae9d, roughness: 0.5, metalness: 0.15 })
  );
  marker.position.y = topY + 0.3;   // 조각이 전시대(없으면 바닥) 위에 놓임
  marker.castShadow = true;
  g.add(marker);
  g.userData.marker = marker;
  return g;
}

// ─── 4개 존 그룹 ───
const zones = {
  move:   { group: new THREE.Group(), items: [], spot: null },  // 중앙홀 — 조각
  rest:   { group: new THREE.Group(), items: [], spot: null },  // 왼쪽 벽체 — 풍경화
  groom:  { group: new THREE.Group(), items: [], spot: null },  // 중앙 벽체 — 초상화
  manage: { group: new THREE.Group(), items: [], spot: null },  // 오른쪽 벽체 — 추상화
};
Object.values(zones).forEach(z => scene.add(z.group));

// 중앙홀 — 조각 전시대: 앞열 3(#1,#2,#3) + 뒷열 2(#4,#5)
// [x, z, 전시대높이]. 지금은 컨셉 시연용 고정값 (좌측 컨트롤 미연동).
//   #1,#2,#3 = 0.3 · #4 = 0.6 · #5 = 0.936
const PED_LAYOUT = [
  [-2.0, -3.0, 0.3],     // #1 앞열-좌
  [ 0.0, -3.0, 0.3],     // #2 앞열-중
  [ 2.0, -3.0, 0.3],     // #3 앞열-우
  [-1.2, -5.5, 0.6],     // #4 뒷열-좌
  [ 1.2, -5.5, 0.936],   // #5 뒷열-우
];
PED_LAYOUT.forEach(([x, z, h]) => {
  const p = makePedestal(h);
  p.position.set(x, 0, z);
  zones.move.group.add(p);
  zones.move.items.push(p);
});

// 왼쪽 벽체 — 풍경화 (가로형)
[0.5, -2.2, -4.6, -7.2].forEach(z => {
  const f = makeFrame(2.0, 1.25);
  f.rotation.y = Math.PI / 2;
  f.position.set(-HALF_W + 0.06, 1.8, z);
  zones.rest.group.add(f);
  zones.rest.items.push(f);
});

// 중앙 벽체 — 초상화 (세로형)
[-2.4, -0.8, 0.8, 2.4].forEach(x => {
  const f = makeFrame(1.1, 1.55);
  f.position.set(x, 1.9, BACK_Z + 0.06);
  zones.groom.group.add(f);
  zones.groom.items.push(f);
});

// 오른쪽 벽체 — 추상화 (정방형)
[0.5, -2.2, -4.6, -7.2].forEach(z => {
  const f = makeFrame(1.45, 1.45);
  f.rotation.y = -Math.PI / 2;
  f.position.set(HALF_W - 0.06, 1.9, z);
  zones.manage.group.add(f);
  zones.manage.items.push(f);
});

// ─── 기본 조명 ───
const ambient = new THREE.AmbientLight(0xffffff, 0.16);
scene.add(ambient);
const hemi = new THREE.HemisphereLight(0xfff4e2, 0x6d685f, 0.24);
scene.add(hemi);

// ─── 태양광: 정적 고정 (좌→우 이동은 추후 도입, 지금은 자동 애니메이션 없음) ───
const sun = new THREE.DirectionalLight(0xfff0d8, 0.3);
sun.position.set(-8, 13, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 70;
sun.shadow.camera.left = -14;
sun.shadow.camera.right = 14;
sun.shadow.camera.top = 14;
sun.shadow.camera.bottom = -14;
sun.shadow.bias = -0.0008;
const sunTarget = new THREE.Object3D();
sunTarget.position.set(0, 1.4, MID_Z);
scene.add(sunTarget);
sun.target = sunTarget;
scene.add(sun);

// ─── 존별 스포트라이트 (점수 연동 스캐폴드) ───
function makeZoneSpot(pos, target) {
  const s = new THREE.SpotLight(0xfff3de, 0, 32, Math.PI / 5, 0.55, 1.1);
  s.position.copy(pos);
  const t = new THREE.Object3D();
  t.position.copy(target);
  scene.add(t);
  s.target = t;
  scene.add(s);
  return s;
}
zones.rest.spot   = makeZoneSpot(new THREE.Vector3(-HALF_W + 2.4, ROOM_H - 0.2, -1), new THREE.Vector3(-HALF_W, 1.8, -1));
zones.groom.spot  = makeZoneSpot(new THREE.Vector3(0, ROOM_H - 0.2, BACK_Z + 2.4), new THREE.Vector3(0, 1.9, BACK_Z));
zones.manage.spot = makeZoneSpot(new THREE.Vector3(HALF_W - 2.4, ROOM_H - 0.2, -1), new THREE.Vector3(HALF_W, 1.8, -1));
zones.move.spot   = makeZoneSpot(new THREE.Vector3(0, ROOM_H - 0.1, -1.4), new THREE.Vector3(0, 0.7, -1.4));

// 점수 → 존 밝기. 0점이어도 형체는 보이도록 최소 바닥값 유지.
function zoneFactor(score) { return 0.12 + (score / 100) * 0.85; }
function updateZoneLighting() {
  // 정면벽(groom)을 밝게 올려, 어두운 측면벽 재질과의 값 차이로 코너가 읽히게.
  // 왼쪽(rest)은 태양광이 안 닿아 살짝 더 밝게, 오른쪽(manage)은 기준.
  zones.move.spot.intensity   = zoneFactor(scores.move)   * 0.95;
  zones.rest.spot.intensity   = zoneFactor(scores.rest)   * 1.80;
  zones.groom.spot.intensity  = zoneFactor(scores.groom)  * 1.95;
  zones.manage.spot.intensity = zoneFactor(scores.manage) * 0.95;
}

// ─── 카메라 (갤러리 내부 시점) ───
// 기본: 중앙(안쪽) 벽 정면 고정. 양옆 벽은 가장자리에 살짝만 걸쳐 보이도록 FOV/위치 조정.
const camera = new THREE.PerspectiveCamera(60, W / H, 0.1, 100);
camera.position.set(0, 1.5, 5.5);
camera.rotation.order = 'YXZ';
// 초기 pitch=0 (완전 수평) → 정면벽이 이미지 평면과 평행 → 수직선이 화면 세로선과 평행, 수직 투시 없음.
let yaw = 0, pitch = 0;
// 회전 한계 넓힘 → 양옆 벽 4번째(가장 깊은) 작품까지 안 잘리고 보임.
// 수직 패닝 없음: pitch는 0 고정 (항상 수평 → 수직선 평행 유지).
const YAW_LIMIT = 0.52;
// 자유 시점 줌(FOV) — 클릭 단독샷/복귀와 별개.
let freeFov = 60;
const ZOOM_MIN = 30, ZOOM_MAX = 72;
function applyCam() {
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
}
applyCam();

// 렌즈 시프트: 카메라 각도/원근 변경 없이 갤러리를 화면 위쪽으로 평행이동.
const VIEW_SHIFT_Y = 80;
camera.setViewOffset(W, H, 0, VIEW_SHIFT_Y, W, H);

// 초기 앵글 (천장/허공 클릭 시 복귀 대상)
const INIT = { pos: camera.position.clone(), quat: camera.quaternion.clone(), fov: camera.fov };

// ─── 단독 감상: 클릭 대상 등록 (정면 방향 dir만 저장, 포즈는 클릭 시 계산) ───
const focusables = [];
const _raycastMeshes = [];
function registerObject(g, zoneKey, dir) {
  const data = { group: g, zone: zoneKey, dir: dir.clone().normalize() };
  g.userData.focusable = data;
  focusables.push(data);
  g.traverse(o => { if (o.isMesh) { o.userData._owner = data; _raycastMeshes.push(o); } });
}
zones.rest.items.forEach(g   => registerObject(g, 'rest',   new THREE.Vector3(1, 0, 0)));
zones.groom.items.forEach(g  => registerObject(g, 'groom',  new THREE.Vector3(0, 0, 1)));
zones.manage.items.forEach(g => registerObject(g, 'manage', new THREE.Vector3(-1, 0, 0)));
zones.move.items.forEach(g   => registerObject(g, 'move',   new THREE.Vector3(0, 0, 1)));

// 단독 감상 시 해당 작품을 확실히 밝히는 포커스 조명
const focusLight = new THREE.PointLight(0xfff2dc, 0, 9, 1.5);
scene.add(focusLight);
let focusedZone = null;
function applyFocusLighting(data) {
  updateZoneLighting();                    // 스코어 기반으로 리셋 후
  focusedZone = data.zone;
  const dir = data.camPos.clone().sub(data.target).normalize();
  focusLight.position.copy(data.target).addScaledVector(dir, 1.2);
  focusLight.position.y += 0.3;
  focusLight.intensity = 1.5;
  Object.keys(zones).forEach(k => {        // 다른 존은 어둡게
    if (k !== data.zone) zones[k].spot.intensity *= 0.22;
  });
}
function clearFocusLighting() {
  focusedZone = null;
  focusLight.intensity = 0;
  updateZoneLighting();
}

// ─── 단독 감상: 깨끗한 배경 벽 + 한 작품만 격리해서 돌려보기 ───
const SOLO_FOV = 38;
const SOLO_FILL = 0.6;                        // 작품이 가용 영역의 60%만 차지 → 여백 확보
const _tanV = Math.tan(SOLO_FOV * Math.PI / 360);
const _tanH = _tanV * (W / H);                // 포트레이트 → 수평 화각은 절반
// 그림(액자)은 화면 센터가 아니라 하단 점수카드 위 영역 기준으로 정렬.
const CARD_H = 268;                           // #cards 높이(CSS)와 동일
const CLEAR_H = H - CARD_H;                   // 카드 위 가용 세로 영역(≈500)
const SOLO_SHIFT_FRAME = CARD_H / 2;          // 가용 영역 중앙으로 올리는 렌즈 시프트(≈134)
const soloBgColor = 0xece6d8;                 // 깨끗한 갤러리 벽 색
const BG0 = scene.background.clone();
const soloBackdrop = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 50),
  new THREE.MeshStandardMaterial({ color: soloBgColor, roughness: 1.0, metalness: 0 })
);
soloBackdrop.visible = false;
scene.add(soloBackdrop);

const GALLERY_MESHES = [floor, ceiling, backWall, leftWall, rightWall];
let focusGroup = null;
let soloAngle = 0;
const soloTarget = new THREE.Vector3();
const soloBaseOffset = new THREE.Vector3();   // 작품→카메라 (정면, 거리 포함)
const _box = new THREE.Box3(), _bc = new THREE.Vector3(), _bs = new THREE.Vector3();
const _Y = new THREE.Vector3(0, 1, 0), _off = new THREE.Vector3();
const SOLO_BACKDROP_DIST = 3.5;
// 단독 턴테이블: 카메라가 작품 주위를 돎. 작품 transform은 절대 안 건드림
// → 리셋/전환 시 원복할 게 없어 "전시가 돌아간 채로" 버그가 원천 차단됨.
function applySoloOrbit() {
  _off.copy(soloBaseOffset).applyAxisAngle(_Y, soloAngle);
  camera.position.copy(soloTarget).add(_off);
  camera.quaternion.copy(quatLookingAt(camera.position, soloTarget));
  soloBackdrop.position.copy(soloTarget)
    .addScaledVector(_off.clone().normalize(), -SOLO_BACKDROP_DIST);  // 항상 작품 뒤
  soloBackdrop.quaternion.copy(quatLookingAt(soloBackdrop.position, camera.position));
  focusLight.position.copy(camera.position); focusLight.position.y += 0.4; // 보는 쪽 조명
}

// 갤러리 전체 숨기고 작품 하나(keep)만 남김 / 해제
function setSoloIsolation(on, keep) {
  GALLERY_MESHES.forEach(m => m.visible = !on);
  Object.values(zones).forEach(z => z.items.forEach(g => {
    g.visible = on ? (g === keep) : true;
  }));
  soloBackdrop.visible = on;
  scene.background = on ? new THREE.Color(soloBgColor) : BG0;
}
// 작품 크기에 맞춰 여백 두고 담는 카메라 포즈 (가로/세로 둘 다 안 잘리게).
// isFrame=true(그림): 세로 기준을 "카드 위 가용 영역"으로 잡아 더 작게 → 카드에 안 잘림.
function computeSoloPose(group, dir, isFrame) {
  _box.setFromObject(group);
  _box.getCenter(_bc); _box.getSize(_bs);
  const oh = _bs.y;
  const ow = Math.max(Math.hypot(_bs.x, _bs.z), _bs.x, _bs.z); // 회전 중에도 안 잘리게 대각선 기준
  const vFit = isFrame ? SOLO_FILL * (CLEAR_H / H) : SOLO_FILL;
  const d = Math.max(oh / (2 * vFit * _tanV), ow / (2 * SOLO_FILL * _tanH));
  return { camPos: _bc.clone().addScaledVector(dir, d), target: _bc.clone() };
}

// ─── 카메라 트랜지션(트윈) — 클릭으로만 발동 ───
const _p0 = new THREE.Vector3(), _p1 = new THREE.Vector3();
const _q0 = new THREE.Quaternion(), _q1 = new THREE.Quaternion();
const _lookM = new THREE.Matrix4();
const _UP = new THREE.Vector3(0, 1, 0);
let tween = null;
let mode = 'free';   // 'free' | 'transition' | 'focus' | 'overview'
function quatLookingAt(pos, target) {
  // 카메라 규약: -Z가 target을 향함 (Object3D.lookAt은 +Z라 반대 → Matrix4.lookAt 사용)
  _lookM.lookAt(pos, target, _UP);
  return new THREE.Quaternion().setFromRotationMatrix(_lookM);
}
function startTween(pos, quat, fov, offEnd, onDone) {
  _p0.copy(camera.position); _p1.copy(pos);
  _q0.copy(camera.quaternion); _q1.copy(quat);
  const off0 = (camera.view && camera.view.enabled) ? camera.view.offsetY : 0;
  tween = { t: 0, dur: 0.6, fov0: camera.fov, fov1: fov, off0, off1: offEnd, onDone };
  mode = 'transition';
}
function focusOn(data) {
  focusGroup = data.group;
  soloAngle = 0;
  const isFrame = data.zone !== 'move';        // 그림이면 카드 위 영역 기준 정렬
  const pose = computeSoloPose(focusGroup, data.dir, isFrame);
  soloTarget.copy(pose.target);
  soloBaseOffset.copy(pose.camPos).sub(pose.target);
  // 깨끗한 배경 벽: 초기 각도(soloAngle=0) 기준 작품 뒤쪽 배치
  soloBackdrop.position.copy(pose.target).addScaledVector(data.dir, -SOLO_BACKDROP_DIST);
  soloBackdrop.quaternion.copy(quatLookingAt(soloBackdrop.position, pose.camPos));
  setSoloIsolation(true, focusGroup);          // 갤러리 숨기고 이 작품만
  // 그림: 위쪽 렌즈 시프트로 카드 위 영역 중앙에 / 조각: 시프트 없음(현행 유지)
  startTween(pose.camPos, quatLookingAt(pose.camPos, pose.target), SOLO_FOV,
             isFrame ? SOLO_SHIFT_FRAME : 0,
             () => { mode = 'focus'; });
  applyFocusLighting({ zone: data.zone, camPos: pose.camPos, target: pose.target });
}
function returnToInit() {
  // 복구는 트윈이 끝나 초기 시점에 도착한 뒤 — 복귀 도중 작품 뒷면/잔상 노출 방지.
  startTween(INIT.pos, INIT.quat, INIT.fov, VIEW_SHIFT_Y,
             () => {
               mode = 'free'; yaw = 0; pitch = 0; freeFov = INIT.fov;
               focusGroup = null;              // 작품은 건드린 적 없으므로 복원 불필요
               setSoloIsolation(false);        // 갤러리 복구 + 배경/배경판 원상
               applyCam();
             });
  clearFocusLighting();
}

// ─── 아이소메트릭 전경 오버뷰 (휠 줌아웃 한계에서 전환, 드래그로 방위 회전) ───
const OVERVIEW = {
  center: new THREE.Vector3(0, 0.6, -2),   // 갤러리 중심(바라보는 지점)
  radius: 23,                               // 수평 궤도 반경 (클수록 더 줌아웃)
  height: 16,                               // 중심 대비 카메라 높이 (iso 고도)
  fov: 40,                                  // 포트레이트라 수평 확보 위해 넓게
  shift: 55,                                // 위쪽 렌즈 시프트 (하단 카드 가림 방지)
  az: 0.62,                                 // 현재 방위각 (드래그로 변경)
  AZ0: 0.62,
};
function overviewCamPos(az) {
  return new THREE.Vector3(
    OVERVIEW.center.x + OVERVIEW.radius * Math.sin(az),
    OVERVIEW.center.y + OVERVIEW.height,
    OVERVIEW.center.z + OVERVIEW.radius * Math.cos(az)
  );
}
// 카메라가 어떤 벽 바깥쪽에 있으면(그 벽이 카메라와 내부 사이) 그 벽 작품을 숨김.
// 벽 평면은 단면이라 자동 컬링되지만 액자(박스)는 안 되므로 전경을 가림 → 직접 숨김.
function updateOverviewVisibility(px, pz) {
  const hideRest   = px < -HALF_W;   // 왼쪽 벽 (잘 쉬기)
  const hideManage = px >  HALF_W;   // 오른쪽 벽 (잘 다스리기)
  const hideGroom  = pz <  BACK_Z;   // 정면(안쪽) 벽 (잘 가꾸기)
  zones.rest.items.forEach(g   => g.visible = !hideRest);
  zones.manage.items.forEach(g => g.visible = !hideManage);
  zones.groom.items.forEach(g  => g.visible = !hideGroom);
}
function applyOverviewCam() {
  const p = overviewCamPos(OVERVIEW.az);
  camera.position.copy(p);
  camera.quaternion.copy(quatLookingAt(p, OVERVIEW.center));
  updateOverviewVisibility(p.x, p.z);
}
function enterOverview() {
  ceiling.visible = false;                  // 위에서 내려다보도록 천장 숨김
  OVERVIEW.az = OVERVIEW.AZ0;
  const p = overviewCamPos(OVERVIEW.az);
  updateOverviewVisibility(p.x, p.z);       // 진입 즉시 근접 벽 작품 숨김 (팝 방지)
  startTween(p, quatLookingAt(p, OVERVIEW.center), OVERVIEW.fov, OVERVIEW.shift,
             () => { mode = 'overview'; });
}

// ─── 입력: 1포인터 회전(드래그와 같은 방향) · 2포인터 핀치줌 · 휠줌 · 클릭 ───
const _ray = new THREE.Raycaster();
const _ndc = new THREE.Vector2();
const pointers = new Map();               // pointerId → {x,y}
let downX = 0, downY = 0, moved = 0;
let pinching = false, pinchUsed = false, pinchD0 = 0, pinchF0 = 0;
const CLICK_SLOP = 6;

function pickFocusable(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  _ndc.x = ((clientX - r.left) / r.width) * 2 - 1;
  _ndc.y = -((clientY - r.top) / r.height) * 2 + 1;
  _ray.setFromCamera(_ndc, camera);
  const hits = _ray.intersectObjects(_raycastMeshes, false);
  for (const h of hits) {
    const o = h.object.userData._owner;
    // 레이캐스터는 invisible도 맞히므로, 격리되어 숨겨진 작품은 건너뜀
    if (o && o.group.visible) return o;
  }
  return null;
}
function applyZoom(fov) {
  freeFov = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, fov));
  camera.fov = freeFov;
  camera.updateProjectionMatrix();        // 렌즈 시프트(setViewOffset) 자동 유지
}
function pinchDist() {
  const p = [...pointers.values()];
  return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
}

canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  if (mode === 'transition') return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  canvas.setPointerCapture(e.pointerId);
  if (pointers.size === 1) {
    downX = e.clientX; downY = e.clientY; moved = 0; pinching = false; pinchUsed = false;
  } else if (pointers.size === 2) {
    pinching = true; pinchUsed = true; pinchD0 = pinchDist(); pinchF0 = freeFov;
  }
});
window.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;

  if (pinching && pointers.size >= 2) {
    if (mode === 'free') applyZoom(pinchF0 * pinchD0 / Math.max(1, pinchDist()));
    return;
  }
  if (pointers.size === 1) {
    moved += Math.abs(dx) + Math.abs(dy);
    if (mode === 'free') {
      // 잡고 끄는 느낌: 드래그 방향과 같은 방향으로 벽이 움직임 (좌우만, 수직 패닝 없음).
      yaw = Math.max(-YAW_LIMIT, Math.min(YAW_LIMIT, yaw + dx * 0.0035));
      applyCam();
    } else if (mode === 'overview') {
      // 아이소메트릭 턴테이블: 드래그로 미술관을 좌우로 돌림 (방위각, 고도 고정).
      OVERVIEW.az -= dx * 0.005;
      applyOverviewCam();
    } else if (mode === 'focus' && focusGroup) {
      // 단독 턴테이블: 드래그로 카메라가 작품 주위를 돎 (작품 자체는 안 움직임).
      soloAngle -= dx * 0.01;
      applySoloOrbit();
    }
  }
});
function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinching = false;
  if (pointers.size > 0) return;            // 아직 손가락 남아있음
  if (mode === 'transition') return;
  if (moved <= CLICK_SLOP && !pinchUsed) {  // 드래그/핀치가 아니라 클릭
    const cx = e.clientX === undefined ? downX : e.clientX;
    const cy = e.clientY === undefined ? downY : e.clientY;
    const hit = pickFocusable(cx, cy);
    if (hit && !(mode === 'focus' && hit.group === focusGroup)) {
      focusOn(hit);                         // 작품/조각 클릭 → 단독 감상 (다른 작품이면 전환)
    } else if (!hit) {
      returnToInit();                       // 빈 배경/허공 클릭 → 초기 앵글 (focus 중 같은 작품 재클릭은 무시)
    }
  }
  pinchUsed = false;
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);

// 휠 줌 (스크롤 업 = 줌인)
canvas.addEventListener('wheel', e => {
  if (mode === 'transition' || mode === 'focus') return;
  e.preventDefault();
  if (mode === 'overview') {
    if (e.deltaY < 0) returnToInit();              // 오버뷰에서 줌인 → 초기 뷰 복귀
    return;
  }
  // mode === 'free'
  if (e.deltaY > 0 && freeFov >= ZOOM_MAX - 0.01) { // 줌아웃 한계 도달 → 전경 오버뷰
    enterOverview();
    return;
  }
  applyZoom(freeFov + e.deltaY * 0.025);
}, { passive: false });

// ─── 렌더 루프 ───
function easeInOut(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; }
let _last = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - _last) / 1000, 0.05);
  _last = now;
  if (tween) {
    tween.t = Math.min(1, tween.t + dt / tween.dur);
    const e = easeInOut(tween.t);
    camera.position.lerpVectors(_p0, _p1, e);
    camera.quaternion.copy(_q0).slerp(_q1, e);
    camera.fov = tween.fov0 + (tween.fov1 - tween.fov0) * e;
    const off = tween.off0 + (tween.off1 - tween.off0) * e;
    if (off > 0.5) camera.setViewOffset(W, H, 0, off, W, H);
    else camera.clearViewOffset();
    camera.updateProjectionMatrix();
    if (tween.t >= 1) { const done = tween.onDone; tween = null; if (done) done(); }
  }
  renderer.render(scene, camera);
}
animate();

// ─── 슬라이더: 값 표시 동기화 (slow_planet과 동일 흐름) ───
// 슬라이더 조작은 draft 값만 갱신. '입력' 버튼을 눌러야 scores/카드/조명에 반영됨.
const sliderConfig = [
  { id: 'move',   valueId: 'val-move',   cardId: 'card-move'   },
  { id: 'rest',   valueId: 'val-rest',   cardId: 'card-rest'   },
  { id: 'groom',  valueId: 'val-groom',  cardId: 'card-groom'  },
  { id: 'manage', valueId: 'val-manage', cardId: 'card-manage' },
];
const scores = {};
const cardEls = {};
function paintSlider(slider) {
  const v = parseInt(slider.value, 10);
  slider.style.background =
    `linear-gradient(to right, #cbc3ba 0%, #cbc3ba ${v}%, #e0e0e0 ${v}%, #e0e0e0 100%)`;
}
sliderConfig.forEach(({ id, valueId, cardId }) => {
  const slider = document.getElementById('slider-' + id);
  const valueLabel = document.getElementById(valueId);
  cardEls[id] = document.getElementById(cardId);
  scores[id] = parseInt(slider.value, 10);
  paintSlider(slider);
  slider.addEventListener('input', () => {
    valueLabel.textContent = slider.value;
    paintSlider(slider);
  });
});

function applyScores() {
  sliderConfig.forEach(({ id }) => {
    const slider = document.getElementById('slider-' + id);
    scores[id] = parseInt(slider.value, 10);
    cardEls[id].textContent = scores[id];
  });
  updateZoneLighting();
}
document.getElementById('submit-btn').addEventListener('click', applyScores);
updateZoneLighting();

// ─── (dev) 디버그용 외부 노출 ───
window.__debug = {
  camera, scene, zones, sun, focusables,
  focusOn, returnToInit,
  state: () => ({ mode, focusedZone }),
};
window.__scores = scores;
</script>
</body>
